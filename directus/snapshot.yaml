  - collection: site_build
    field: hint
    type: alias
    meta:
      collection: site_build
      conditions:
        - name: Идёт сборка
          options:
            color: warning
            icon: hourglass_top
            text: >-
              Обычно 10–30 секунд, с новыми фото — до минуты. Страница обновится
              сама, когда сборка закончится. Если сохранить ещё раз, пока идёт
              сборка, после неё сразу пройдёт следующая.
          rule:
            status:
              _eq: building
        - name: Опубликовано
          options:
            color: success
            icon: check_circle
            text: >-
              Последние изменения уже на сайте. Если правки всё равно не видно —
              ниже, в «Что на сайте», написано, что осталось черновиком; на
              телефоне обновите страницу сайта.
          rule:
            status:
              _eq: ok
        - name: Ошибка
          options:
            color: danger
            icon: error
            text: >-
              На сайте осталась прежняя версия. Текст ошибки ниже — перешлите
              его разработчику. Следующее сохранение запустит сборку заново.
          rule:
            status:
              _eq: error
        - name: Есть правки
          options:
            color: warning
            icon: sync_problem
            text: >-
              На сайте нет части правок: сборка после них не запустилась. Сторож
              запустит её сам в ближайшие две минуты — страница обновится сама.
              Если статус держится дольше пяти минут — напишите разработчику.
          rule:
            status:
              _eq: stale
      display: null
      display_options: null
      field: hint
      group: null
      hidden: false
      interface: presentation-notice
      note: null
      options:
        color: info
        icon: schedule
        text: >-
