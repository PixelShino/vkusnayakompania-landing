# Directus admin for the site. Same file for local dev and the VPS:
# the only difference is `.env` (see `.env.example`).
# Админка Directus. Один файл для локали и VPS, разница только в `.env`.
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./data/database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: directus
    healthcheck:
      test: ['CMD', 'pg_isready', '--host=localhost', '--username=directus']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  directus:
    image: directus/directus:11.17.4
    restart: unless-stopped
    # bound to localhost only: nginx (VPS) or the browser (local) talk to it
    # только localhost: снаружи ходит nginx на VPS или браузер на локали
    ports:
      - '127.0.0.1:${DIRECTUS_PORT:-8055}:8055'
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, а не localhost: внутри контейнера он резолвится в ::1, а Directus слушает IPv4
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:8055/server/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # api.telegram.org: from a server in Russia only some of Telegram's addresses
    # answer (23.10.2026: 149.154.167.220 does, 149.154.166.110 from DNS does not);
    # the pin can be changed in .env without touching this file
    # api.telegram.org: с сервера в России отвечают не все адреса Telegram
    # (23.10.2026: 149.154.167.220 — да, 149.154.166.110 из DNS — нет);
    # закрепление меняется в .env, этот файл трогать не нужно
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    environment:
      SECRET: ${SECRET}
      PUBLIC_URL: ${PUBLIC_URL}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD}

      # first boot only: creates the admin user
      # только первый запуск: создаёт администратора
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # invites and password resets; empty transport = no mail (local dev)
      # приглашения и сброс пароля; пустой транспорт = без почты (локаль)
      EMAIL_FROM: ${EMAIL_FROM:-noreply@vkus-com.ru}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-sendmail}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}

      # editors see the admin in Russian by default
      # редакторы видят админку по-русски
      DEFAULT_LANGUAGE: ru-RU
      TELEMETRY: 'false'

      # The site's cart sends orders straight from the visitor's browser
      # (`POST /items/orders`, public role: create only). Only the site's own
      # origins may do that; local development puts its preview address into
      # `.env` (CORS_ORIGIN=http://127.0.0.1:4321).
      # Корзина сайта отправляет заказ прямо из браузера посетителя
      # (`POST /items/orders`, публичная роль: только создание). Делать это
      # можно только с адресов самого сайта; локально адрес превью кладётся
      # в `.env` (CORS_ORIGIN=http://127.0.0.1:4321).
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vkus-com.ru,https://www.vkus-com.ru}
      CORS_METHODS: GET,POST

      # Who the visitor is, for the order limit (and the login limit): nginx
      # appends the real address to `X-Forwarded-For`, so exactly one hop is
      # trusted — docker's own proxy — and the address a script writes in front
      # of the header is ignored. Directus's default (`true`) takes the leftmost
      # one, which anyone can forge.
      # Кто посетитель — для лимита заказов (и лимита входа): nginx дописывает
      # настоящий адрес в конец `X-Forwarded-For`, поэтому доверяем ровно
      # одному звену — прокси самого docker, — а адрес, который скрипт впишет
      # в начало заголовка, не учитывается. По умолчанию Directus (`true`)
      # берёт самый левый, а его подделает кто угодно.
      IP_TRUST_PROXY: ${IP_TRUST_PROXY:-1}

      # Online payment (`extensions/pay`), optional: a non-empty value beats
      # the field of the «Оплата» singleton in the admin, so the bank's secrets
      # can stay out of the database and its backups. Empty — the admin rules.
      # Онлайн-оплата (`extensions/pay`), необязательно: непустое значение
      # важнее поля синглтона «Оплата» в админке — секреты банка не попадают в
      # базу и её бэкапы. Пусто — действует админка.
      PAY_ENABLED: ${PAY_ENABLED:-}
      PAY_MODE: ${PAY_MODE:-}
      PAY_PROVIDER: ${PAY_PROVIDER:-}
      # ЮKassa (the default bank): shopId and the secret key from the ЮKassa
      # cabinet («Интеграция» → «Ключи API»); PAY_YOOKASSA_API — only for a
      # check against a fake ЮKassa, works in test mode only, empty on a server
      # ЮKassa (банк по умолчанию): shopId и секретный ключ из кабинета ЮKassa
      # («Интеграция» → «Ключи API»); PAY_YOOKASSA_API — только для проверки на
      # поддельной ЮKassa, действует лишь в тесте, на сервере пусто
      PAY_YOOKASSA_SHOP_ID: ${PAY_YOOKASSA_SHOP_ID:-}
      PAY_YOOKASSA_SECRET_KEY: ${PAY_YOOKASSA_SECRET_KEY:-}
      PAY_YOOKASSA_API: ${PAY_YOOKASSA_API:-}
      PAY_ALFA_LOGIN: ${PAY_ALFA_LOGIN:-}
      PAY_ALFA_PASSWORD: ${PAY_ALFA_PASSWORD:-}
      PAY_ALFA_TOKEN: ${PAY_ALFA_TOKEN:-}
      PAY_ALFA_GATEWAY: ${PAY_ALFA_GATEWAY:-}
      PAY_CALLBACK_KEY: ${PAY_CALLBACK_KEY:-}
      PAY_SITE_URL: ${PAY_SITE_URL:-}

      # Sign-in to the guest account by phone (`guest-auth`): the SMS Aero
      # account (email and API key from smsaero.ru → «Настройки» → «API»).
      # Empty — the account page says to call. `GUEST_AUTH_DEBUG=true` sends
      # nothing and writes codes to this log (with `GUEST_AUTH_DEBUG_CODE` —
      # one fixed code): for a local stand only, never in production.
      # Вход в личный кабинет по телефону (`guest-auth`): аккаунт SMS Aero
      # (почта и API-ключ из smsaero.ru → «Настройки» → «API»). Пусто — кабинет
      # просит позвонить. `GUEST_AUTH_DEBUG=true` ничего не отправляет и пишет
      # коды в этот лог (с `GUEST_AUTH_DEBUG_CODE` — один постоянный код):
      # только для локального стенда, на боевом — никогда.
      SMSAERO_EMAIL: ${SMSAERO_EMAIL:-}
      SMSAERO_API_KEY: ${SMSAERO_API_KEY:-}
      GUEST_AUTH_DEBUG: ${GUEST_AUTH_DEBUG:-false}
      GUEST_AUTH_DEBUG_CODE: ${GUEST_AUTH_DEBUG_CODE:-}
