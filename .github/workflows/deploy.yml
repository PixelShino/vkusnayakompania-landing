name: Выкладка на VPS

# Push to main → the VPS pulls the code and rebuilds the site.
# Content changes never go through here: Directus calls the webhook directly.
# Пуш в main → VPS забирает код и пересобирает сайт.
# Изменения контента сюда не ходят: Directus дёргает вебхук напрямую.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # skipped until the VPS secrets exist / пропуск, пока нет секретов VPS
    if: ${{ vars.VPS_HOST != '' }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Известный хост
        run: ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Сборка на сервере
        run: |
          ssh "deploy@${{ vars.VPS_HOST }}" \
            'cd /srv/vkus/site && git pull --ff-only && deploy/build.sh'
