# Where each old address goes. `map` lives in the http context, hence conf.d.
# /etc/nginx/conf.d/20-old-domains-map.conf
# Куда ведёт каждый старый адрес. `map` живёт в контексте http, поэтому conf.d.
# long product paths do not fit the default 64-byte bucket
# длинные пути товаров не влезают в корзину хеша по умолчанию (64 байта)
map_hash_bucket_size 256;
map_hash_max_size 4096;

map $uri $vkusdostavka_target {
    default "/catalog/";
    include /etc/nginx/snippets/old-domains/vkusdostavka.map;
}
map $uri $vkusnayakompania_target {
    default "/catering/";
    include /etc/nginx/snippets/old-domains/vkusnayakompania.map;
}
