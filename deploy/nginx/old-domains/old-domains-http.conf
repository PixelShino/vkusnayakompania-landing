# Old domains → vkus-com.ru, page by page (docs/SEO.md, «Старые домены»).
# Installed by deploy/old-domains.sh: the http part at once, the https part once
# the DNS points here and certbot has issued the certificate.
# Старые домены → vkus-com.ru постранично (docs/SEO.md, «Старые домены»).
# Ставится deploy/old-domains.sh: часть http сразу, часть https — когда DNS
# смотрит сюда и certbot выпустил сертификат.
server {
    listen 80;
    listen [::]:80;
    server_name vkusdostavka.shop www.vkusdostavka.shop;
    # the ACME challenge for certbot (webroot), everything else is a 301 to the new site
    # проверка ACME для certbot (webroot), всё остальное — 301 на новый сайт
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://vkus-com.ru$vkusdostavka_target; }
}

server {
    listen 80;
    listen [::]:80;
    server_name vkusnayakompania.ru www.vkusnayakompania.ru;
    # the ACME challenge for certbot (webroot), everything else is a 301 to the new site
    # проверка ACME для certbot (webroot), всё остальное — 301 на новый сайт
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://vkus-com.ru$vkusnayakompania_target; }
}
