server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vkusdostavka.shop www.vkusdostavka.shop;
    ssl_certificate /etc/letsencrypt/live/vkusdostavka.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkusdostavka.shop/privkey.pem;
    location / { return 301 https://vkus-com.ru$vkusdostavka_target; }
}
