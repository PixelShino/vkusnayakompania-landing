server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vkusnayakompania.ru www.vkusnayakompania.ru;
    ssl_certificate /etc/letsencrypt/live/vkusnayakompania.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkusnayakompania.ru/privkey.pem;
    location / { return 301 https://vkus-com.ru$vkusnayakompania_target; }
}
