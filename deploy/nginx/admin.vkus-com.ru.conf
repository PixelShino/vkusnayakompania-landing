# Directus admin + webhook receiver. /etc/nginx/sites-available/admin.vkus-com.ru
# Админка Directus и приёмник вебхука.
server {
    listen 80;
    listen [::]:80;
    server_name admin.vkus-com.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.vkus-com.ru;
    ssl_certificate /etc/letsencrypt/live/admin.vkus-com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vkus-com.ru/privkey.pem;

    # photo uploads / загрузка фото
    client_max_body_size 64m;

    # rebuild hook from the Directus flow → adnanh/webhook on :9000
    # вебхук пересборки из Flow → adnanh/webhook на :9000
    location /hooks/ {
        proxy_pass http://127.0.0.1:9000/hooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
