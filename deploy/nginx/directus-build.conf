# Local proxy for the site build, 127.0.0.1:8056. /etc/nginx/sites-available/directus-build
# Только для сборки сайта (DIRECTUS_URL в /srv/vkus/site/.env): Directus отвечает на
# картинки без 304, и Astro каждый раз пережимает все фото заново. nginx сверяет
# If-Modified-Since с Last-Modified и отвечает 304, если файл не менялся. Кеш не
# читается (bypass), ответы всегда свежие из Directus — хранится только метка для 304.
proxy_cache_path /var/cache/nginx/directus-assets levels=1:2 keys_zone=directus_assets:1m max_size=64m inactive=1d use_temp_path=off;

server {
    listen 127.0.0.1:8056;
    server_name _;

    location /assets/ {
        proxy_pass http://127.0.0.1:8055;
        proxy_cache directus_assets;
        proxy_cache_bypass 1;
        proxy_cache_valid 200 1s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    }

    location / {
        proxy_pass http://127.0.0.1:8055;
    }
}
