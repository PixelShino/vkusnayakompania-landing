# Static site from the current release. /etc/nginx/sites-available/vkus-com.ru
# Статика из текущего релиза.
# `listen … http2`, а не `http2 on;`: директива появилась в nginx 1.25.1, в Ubuntu 24.04 стоит 1.24.
server {
    listen 80;
    listen [::]:80;
    server_name vkus-com.ru www.vkus-com.ru;
    return 301 https://vkus-com.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vkus-com.ru;
    ssl_certificate /etc/letsencrypt/live/vkus-com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkus-com.ru/privkey.pem;
    return 301 https://vkus-com.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vkus-com.ru;
    ssl_certificate /etc/letsencrypt/live/vkus-com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkus-com.ru/privkey.pem;

    root /srv/vkus/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # hashed assets: cache forever / хешированные ассеты — кеш навсегда
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PDFs from Directus: replaced by rebuild, short cache / PDF из админки
    location /media/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
