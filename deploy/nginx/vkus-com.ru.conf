# Static site from the current release. /etc/nginx/sites-available/vkus-com.ru
# Статика из текущего релиза.
# `listen … http2`, а не `http2 on;`: директива появилась в nginx 1.25.1, в Ubuntu 24.04 стоит 1.24.
server {
    listen 80;
    listen [::]:80;
    server_name vkus-com.ru www.vkus-com.ru;
    return 301 https://vkus-com.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vkus-com.ru;
    ssl_certificate /etc/letsencrypt/live/vkus-com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkus-com.ru/privkey.pem;
    return 301 https://vkus-com.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vkus-com.ru;
    ssl_certificate /etc/letsencrypt/live/vkus-com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkus-com.ru/privkey.pem;

    root /srv/vkus/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # hashed assets: cache forever. `add_header` in a location drops the
    # server-level headers, so the security ones are repeated here.
    # хешированные ассеты — кеш навсегда. `add_header` внутри location
    # отменяет заголовки уровня server, поэтому защитные повторены здесь.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # documents from the admin keep their address after a replacement (QR codes,
    # map listings link to them), so the browser revalidates every time: an
    # unchanged file costs a 304, a replaced one arrives at once
    # документы из админки после замены сохраняют адрес (на них ведут QR-коды
    # и карточки в картах), поэтому браузер перепроверяет их каждый раз:
    # неизменённый файл стоит одного 304, заменённый приходит сразу
    location /media/ {
        expires -1;
    }

    # the page itself: without a rule browsers guessed a lifetime from
    # Last-Modified and showed a stale page for up to a couple of hours
    # сама страница: без правила браузеры выводили срок из Last-Modified
    # и до пары часов показывали устаревшую
    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
