# Static site from the current release. /etc/nginx/sites-available/vkus-com.ru
# Статика из текущего релиза.
server {
    listen 80;
    listen [::]:80;
    server_name vkus-com.ru www.vkus-com.ru;
    return 301 https://vkus-com.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vkus-com.ru;
    ssl_certificate /etc/letsencrypt/live/vkus-com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkus-com.ru/privkey.pem;
    return 301 https://vkus-com.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vkus-com.ru;
    ssl_certificate /etc/letsencrypt/live/vkus-com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkus-com.ru/privkey.pem;

    root /srv/vkus/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # nginx quirk: an add_header inside a location cancels the ones inherited
    # from the server block, so both security headers are repeated in each.
    # Грабли nginx: свой add_header в location отменяет унаследованные из
    # server, поэтому оба заголовка безопасности повторены в каждом.

    # hashed assets: the name carries a content hash, new bytes mean a new URL
    # Хешированные ассеты: имя несёт хеш содержимого, новые байты — новый адрес
    location /_astro/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # a PDF is named after its Directus record, so replacing a menu in the admin
    # leaves the URL untouched: revalidate instead of trusting a timer
    # PDF назван по записи в Directus: замена меню в админке адрес не меняет,
    # поэтому не таймер, а перепроверка — ETag отдаёт 304 и файл не качается
    location /media/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    # HTML has no hash in its name either; with no explicit header the browser
    # caches it by its own heuristic and a returning visitor sees stale text
    # У HTML в имени тоже нет хеша: без явного заголовка браузер кеширует его на
    # своё усмотрение, и вернувшийся посетитель увидит вчерашний текст
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
