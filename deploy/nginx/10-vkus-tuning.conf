# Server-wide nginx tuning. /etc/nginx/conf.d/10-vkus-tuning.conf
# Общие настройки nginx на сервере.
# TLS: кеш сессий, без тикетов
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# таймауты против медленных клиентов
keepalive_timeout 30s;
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;
# без кеша дескрипторов: релиз переключается симлинком, и кеш до 2 мин отдавал старый index.html и запомненные 404
# no descriptor cache: releases switch by symlink, and the cache served the old index.html and remembered 404s for up to 2 min
open_file_cache off;
